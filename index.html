<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Артем Журавлев — Архитектор / Дизайнер интерьеров</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <!-- Шапка -->
        <div class="header-bg">
            <div class="avatar-container">
                <!-- Укажите название файла вашей аватарки -->
                <img src="avatar.jpg" alt="Артем Журавлев" class="avatar">
            </div>
        </div>

        <!-- Контент -->
        <div class="content">
            <h1 class="name">АРТЕМ ЖУРАВЛЕВ</h1>
            <p class="subtitle">АРХИТЕКТОР / ДИЗАЙНЕР ИНТЕРЬЕРОВ<br>Г. МОСКВА</p>

            <!-- Кнопки   -->
            <div class="buttons">
                <!-- Замените '#' на реальную ссылку на портфолио -->
                <a href="#" target="_blank" class="btn">МОИ РАБОТЫ</a>
                
                <!-- Переход на вторую страницу -->
                <a href="awards.html" class="btn">МЕЖДУНАРОДНЫЕ ПРЕМИИ</a>
                
                <!-- Замените '#' на нужную ссылку -->
                <a href="#" target="_blank" class="btn">АРХИТЕКТОР В УТИЛЕ</a>
                
                <!-- Замените '#' на ссылку на Telegram (например, https://t.me/yourusername) -->
                <a href="#" target="_blank" class="btn">TELEGRAM</a>
                
                <!-- Замените email@example.com на вашу почту -->
                <a href="mailto:email@example.com" class="btn">НАПИСАТЬ НА ПОЧТУ</a>
            </div>
        </div>
    </div>
</body>
</html>
